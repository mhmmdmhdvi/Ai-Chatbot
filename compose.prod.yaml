services:
  db:
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 90
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - app_network

  nginx-bootstrap:
    image: nginx:1.28-alpine
    profiles: ["bootstrap"]
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
    restart: "no"
    networks:
      - app_network

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["certificate"]
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - app_network

volumes:
  letsencrypt_data:
  certbot_webroot:
